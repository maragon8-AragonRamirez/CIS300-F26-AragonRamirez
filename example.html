<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A sample Revist capsule: a laugh, a note, and the light that day.">
  <title>A laugh. A note. | Revist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&amp;family=Caveat:wght@500&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="example.css">
</head>
<body>
  <a class="skip-link" href="#example">Skip to the example</a>
  <header class="example-header">
    <a class="brand" href="index.html"><span class="brand-mark">R</span> Revist</a>
    <a class="back-link" href="index.html#discover">← Back to Revist</a>
  </header>

  <main class="example-scene" id="example">
    <div class="scene-copy">
      <p class="eyebrow">A summer capsule · 2031</p>
      <h1>A laugh. A note.<br><em>The light that day.</em></h1>
      <p class="scene-caption">02 / 05 &nbsp; · &nbsp; OPENED FIVE YEARS LATER</p>
    </div>

    <div class="keepsake-box">
      <div class="sample-photo" role="img" aria-label="Blank sample image placeholder">Sample image</div>
      <div class="note">for later</div>
      <div class="box-lid"></div>
      <div class="box-body"><button class="open-capsule" type="button">Open when you're ready</button></div>
    </div>

    <p class="memory-caption">Some ordinary days find their way back to us.</p>
    <p class="popup-fallback" id="popup-fallback" role="status" hidden>
      Your browser blocked the popup.
      <a href="blank-capsule.html" target="_blank" rel="noopener">Open your blank capsule in a new tab.</a>
    </p>
  </main>
  <script src="example.js"></script>
</body>
</html>
